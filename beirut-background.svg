        <path d="M8 -240C40 -300 70 -330 120 -335C80 -305 50 -275 8 -240Z"/>
        <path d="M8 -240C-60 -240 -120 -200 -150 -150C-100 -190 -50 -215 8 -240Z"/>
        <path d="M8 -240C80 -240 140 -200 170 -150C120 -190 70 -215 8 -240Z"/>
