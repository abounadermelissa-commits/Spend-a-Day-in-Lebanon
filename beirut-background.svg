<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b6fb6"/>
      <stop offset="0.45" stop-color="#f4a261"/>
      <stop offset="0.8" stop-color="#ffd59a"/>
      <stop offset="1" stop-color="#ffe9c2"/>
