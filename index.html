<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Day In Lebanon</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/Flag_of_Lebanon.svg/1280px-Flag_of_Lebanon.svg.png?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=thumbnail">
</head>
<body>
    <div id="scene">
    <div id="start">
        <button id="start-btn">Spend a day in Lebanon</button>
    </div>
    <div id="entering"></div>
    <div id="beirut">
        <img src="bride-groom-transparent.gif" id="bride-groom" alt="the bride and the groom">
        <img src="dancers-left (1).gif" id="dancers-l" alt="dancers">
        <img src="dancers-right (1).gif" id="dancers-r" alt="dancers">
        <button class="name">BEIRUT</button>
        <button id="next1"> > </button>
          <audio id="music" auto loop>
          <source src="Original Zaffeh.mp3" type="audio/mpeg">
          </audio>
           </div>
        <div id="tripoly">
           <button class="name">TRIPOLY</button>
           <img src="kaak-seller.gif" id="kaak-seller" alt="kaak seller">
           <audio id="kaakSound">
           <source src="Man_06391b83-bef2-47c1-b43c-ec1f4bee0e61.mp3" type="audio/mpeg">
           </audio>
           <img src="girl-tripoli-wave-v2.gif" id="tripoly-girl" alt="girl walking">
           <audio id="girl-sound">
           <source src="Girl_0ddc492c-fc93-455e-b1fc-36bab896795c.mp3" type="audio/mpeg">
           </audio>
            <audio id="background-song">
             <source src="Frasha Wa Zahra.mp3" type="audio/mpeg">
            </audio>
           <img src="talking_friends_transparent.gif" id="friends" alt="friend talking">
           <button id="next2"> > </button>
        </div>
        <div id="baalbek">
          <img src="baalbek-girl-full.png" id="girl" alt="woman">
          <img src="baalbek-man-in-love.png" id="man" alt="man">
           <audio id="houwara">
           <source src="Al Walid ft. @AssiElHallani - Howara الوليد وعاصي الحلاني - الهوارة.mp3" type="audio/mpeg">
           </audio>
           <img src="baalbek-old-women-gossip.png" id="gossip" alt="old women gossiping">
           <img src="friends_walking_short.gif" id="jealous" alt="jealous woman">
           <img src="hashura_alone.gif" id="samia" alt="eavesdropper woman">
           <img src="rooftop_watchers.gif" id="many" alt="rooftop watchers eavesdropping.">
           <img src="baalbek-child-clapping-cropped.gif" id="child" alt="child clapping">
           <img src="baalbek-mom-go-study.gif" id="angry-mum" alt="angry mum">
           <button class="name">Baalbek</button>
             <button id="next3"> > </button>
        </div>
        <div id="jounieh">
           <img src="family_walking.gif" id="fam-walk" alt="family walking">
           <img src="lebanese_coffee_waiter.gif" id="waiter" alt="coffee waiter">
            <img src="fairuz.gif" id="fairuz-img" alt="fairuz">
            <img src="press-photographer-flash.gif" id="press" alt="press photographer">
           <audio id="fairuz">
           <source src="يا انا يا انا - فيروز Ya Ana Ya Ana - Fairuz.mp3" type="audio/mpeg">
           </audio>
           <button class="name">Jounieh</button>
             <button id="next4"> > </button>
        </div>
        <div id="ending">
            <button id="endBtn">Visit Again</button>
        </div> 

    </div>

    <div id="rotate">
        <h1>Please rotate your device</h1>
        <img src="rotate-phone.gif" alt="rotating phone">
    </div>
   
    <script src="script.js"></script>
</body>
</html>
